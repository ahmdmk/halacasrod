name: hala_casrod_app
description: Hala Casrod Grand Fest - Member Directory and Events App
publish_to: 'none'
version: 1.0.6+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  get: ^4.7.2

  # Networking
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.2.7

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Data & Storage
  shared_preferences: ^2.2.3
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.4
  get_it: ^8.2.0
  fluttertoast: ^8.2.4
  carousel_slider: ^5.1.1
  video_player: ^2.10.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appIcon.jpg"
  min_sdk_android: 21




  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
